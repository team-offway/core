name: Diagnose
on:
  workflow_dispatch:
    inputs:
      scope: { description: "미사용", type: choice, default: db, options: [db, external, all] }
      since: { description: "미사용", default: "" }
      until: { description: "미사용", default: "" }
      tour_latency_sample: { description: "미사용", type: boolean, default: false }
permissions:
  contents: read
jobs:
  measure:
    name: 집중률 분포 · 반려동물 상세
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 재기
        env:
          KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python3 -u - <<'PY'
          import glob, json, os, re, statistics, urllib.request
          KEY = os.environ["KEY"]; BASE = "https://apis.data.go.kr/B551011"
          COMMON = f"serviceKey={KEY}&MobileOS=ETC&MobileApp=offway&_type=json"

          def get(u):
              try:
                  with urllib.request.urlopen(u, timeout=12) as r: return json.loads(r.read().decode())
              except Exception as e: print("  실패:", type(e).__name__); return None
          def items(d):
              if not d: return []
              it = d.get("response", {}).get("body", {}).get("items", "")
              it = it.get("item", []) if isinstance(it, dict) else []
              return it if isinstance(it, list) else [it]
          def total(d): return int((d or {}).get("response", {}).get("body", {}).get("totalCount", 0) or 0)

          # 지역코드는 시드에서 읽는다
          legal, area = {}, {}
          for f in sorted(glob.glob("src/main/resources/db/migration/*.sql")):
              s = open(f, encoding="utf-8").read()
              for m in re.finditer(r"UPDATE region SET legal_code='(\d+)' WHERE sido='([^']+)' AND sigungu='([^']+)'", s):
                  legal[(m.group(2), m.group(3))] = m.group(1)
              for m in re.finditer(r"UPDATE region SET lat=[^;]*?area_code=(\d+), sigungu_code=(\d+) WHERE sido='([^']+)' AND sigungu='([^']+)'", s):
                  area[(m.group(3), m.group(4))] = (int(m.group(1)), int(m.group(2)))
          print(f"시드에서 읽은 지역: legal {len(legal)} · area {len(area)}")

          calls = 0
          vals, by_dow, by_region, empty = [], {}, {}, []
          import datetime, time
          started = time.time()
          targets = sorted(legal.items())
          for i, ((sido, sg), lc) in enumerate(targets, 1):
              # **지역당 1페이지(1,000행)만 본다.** 경계값을 정하는 데는 표본이면 충분하고,
              # 전량(89곳 × 최대 4페이지)은 호출 하나가 늦어질 때 배치가 통째로 늘어진다.
              d = get(f"{BASE}/TatsCnctrRateService/tatsCnctrRatedList?{COMMON}&areaCd={lc[:2]}&signguCd={lc}&numOfRows=1000&pageNo=1")
              calls += 1
              tot = total(d)
              rows = items(d)
              # **한 지역 끝날 때마다 찍는다.** 끝에 몰아 찍으면 도중에 아무것도 안 보이고,
              # 중간에 끊기면 그때까지 쓴 호출이 통째로 날아간다.
              print(f"[{i:>2}/{len(targets)}] {sg:<8} {len(rows):>5}행 / {tot or 0:<5} · 누적호출 {calls:>3} · {time.time()-started:5.0f}초")
              if not rows:
                  empty.append(sg); continue
              rv = []
              for x in rows:
                  try: v = float(x["cnctrRate"])
                  except Exception: continue
                  rv.append(v); vals.append(v)
                  ymd = x.get("baseYmd", "")
                  if len(ymd) == 8:
                      dow = datetime.date(int(ymd[:4]), int(ymd[4:6]), int(ymd[6:])).weekday()
                      by_dow.setdefault(dow, []).append(v)
              if rv: by_region[sg] = statistics.median(rv)

          names = "월화수목금토일"
          print(f"\n=== 집중률 분포 (지역 {len(by_region)}곳 · 값 {len(vals):,}개 · 호출 {calls}회) ===")
          vs = sorted(vals)
          def pct(p): return vs[int(len(vs)*p)]
          for p in (0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95, 0.99):
              print(f"  p{int(p*100):<3} {pct(p):6.1f}")
          print(f"  최소 {min(vs):.1f} · 최대 {max(vs):.1f} · 평균 {statistics.mean(vs):.1f}")

          print("\n=== 요일별 중앙값 ===")
          for d in range(7):
              g = by_dow.get(d, [])
              if g: print(f"  {names[d]}  중앙값 {statistics.median(g):5.1f}  (n={len(g):,})")

          print("\n=== 경계 후보 (전체) ===")
          for cut in (55, 60, 65, 70, 75, 80):
              busy = sum(1 for v in vs if v >= cut)
              print(f"  {cut} 이상 붐빔 → {busy/len(vs)*100:5.1f}%")

          # **요일별로 갈라 본다.** 경계를 하나 두면 칩이 사실상 "주말인가" 만 말할 수 있다 —
          # 그건 사용자가 이미 아는 정보라 칩으로 붙일 값어치가 없다.
          print("\n=== 요일 × 경계 — 칩이 붙는 비율 ===")
          print(f"  {'요일':<4} {'붐빔≥70':>8} {'붐빔≥75':>8} {'한산≤25':>8} {'칩없음(25~70)':>14}")
          for d in range(7):
              g = by_dow.get(d, [])
              if not g: continue
              n = len(g)
              b70 = sum(1 for v in g if v >= 70)/n*100
              b75 = sum(1 for v in g if v >= 75)/n*100
              c25 = sum(1 for v in g if v <= 25)/n*100
              mid = 100 - b70 - c25
              print(f"  {names[d]:<4} {b70:7.1f}% {b75:7.1f}% {c25:7.1f}% {mid:13.1f}%")

          print(f"\n데이터 없는 지역 {len(empty)}곳: {', '.join(empty[:12])}{' …' if len(empty)>12 else ''}")
          rm = sorted(by_region.items(), key=lambda kv: kv[1])
          print(f"지역 중앙값 최저 {rm[0][0]} {rm[0][1]:.1f} · 최고 {rm[-1][0]} {rm[-1][1]:.1f}")

          # 반려동물 상세 — 응답 모양 확인
          print("\n=== /detailPetTour2 (태안 갈음이해수욕장 127311) ===")
          d = get(f"{BASE}/KorPetTourService2/detailPetTour2?{COMMON}&contentId=127311")
          it = items(d)
          print("  필드:", sorted(it[0].keys()) if it else "없음")
          if it:
              for k, v in it[0].items():
                  if v and str(v).strip(): print(f"    {k} = {str(v)[:70]}")
          PY
