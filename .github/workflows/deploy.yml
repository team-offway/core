name: Deploy

# EC2 에 배포한다.
#
# **dev 에 들어오면 자동 배포한다.** 첫 배포를 사람이 지켜보며 확인했고(빈 MySQL 에 Flyway 가
# 처음 적용되는 순간이 지났다), 이후 배포는 같은 경로를 반복한다. 손으로 돌리는 동안은 "머지했는데
# 아직 안 올라간" 창이 생겨 무엇이 떠 있는지 헷갈렸다.
#
# 수동 실행(workflow_dispatch)도 남겨 둔다 — 롤백이나 인프라 손질 뒤 재배포에 필요하다.
#
# CI(ci.yml)와 엮지 않았다(workflow_run) — 엮으면 실패 지점이 두 워크플로우에 흩어져 "왜 배포가
# 안 됐는지" 추적이 어렵다. 여기서 테스트를 다시 돌려 배포할 상태 그대로를 검증한다.
# 아래 build 단계가 실패하면 배포 단계로 넘어가지 않으므로, 깨진 코드가 자동으로 올라가지 않는다.
on:
  workflow_dispatch:
  push:
    branches: [dev]
    # 코드가 바뀌지 않는 변경으로 배포를 돌리지 않는다. 문서만 고쳤는데 컨테이너를 교체하면
    # 그 시간만큼 서비스가 끊긴다.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - '.githooks/**'

# 배포가 겹치면 컨테이너 교체가 뒤엉킨다. 앞 배포를 취소하지 않고 순서대로 흘린다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  # 배포 대상 커밋이 이미 테스트를 통과했는지 되짚는 데 쓴다(#298) — 커밋이 담긴 PR 을 찾고(pull-requests),
  # 그 PR head 의 CI 결과를 읽는다(checks). 둘 다 읽기만 한다.
  pull-requests: read
  checks: read

jobs:
  deploy:
    name: build & deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # build.gradle.kts 의 toolchain 과 맞춘다. 바꿀 땐 양쪽을 함께 고친다.
          java-version: '25'

      - name: Gradle 준비 (의존성 캐시 포함)
        uses: gradle/actions/setup-gradle@v6

      # 이 커밋이 **이미 테스트를 통과했는지** 되짚는다(#298).
      #
      # dev 브랜치 보호가 strict + 필수 체크 `build & test` 라, PR 이 dev 최신을 품은 상태에서만
      # 머지된다 — CI 가 검사한 트리와 머지된 트리의 내용이 같다. 그런데 **그 보호를 믿고 건너뛰지
      # 않는다.** 우회 경로가 실재하기 때문이다(수동 배포, enforce_admins=false 인 관리자 직접 push).
      #
      # 그래서 가정하지 않고 사슬을 따라가 확인한다: dev 커밋 → 그 커밋을 담은 PR → PR head 의
      # `build & test` 결과. 어느 고리든 끊기면 전체 빌드로 떨어져 안전망이 유지된다.
      - name: 검증된 커밋인지 확인
        id: verified
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # 1) 이 커밋을 담은 머지된 PR. 없으면 PR 을 안 거친 커밋이다.
          PR_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null)] | first | .head.sha // empty' 2>/dev/null || echo "")
          if [ -z "$PR_HEAD" ]; then
            echo "PR 을 거치지 않은 커밋입니다 — 전체 빌드로 검증합니다."
            echo "tested=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 2) 그 PR head 에서 CI 의 `build & test` 가 통과했는지. 이름은 ci.yml 의 job name 과 같아야 한다.
          RESULT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD}/check-runs" \
            --jq '[.check_runs[] | select(.name == "build & test")] | first | .conclusion // empty' 2>/dev/null || echo "")
          if [ "$RESULT" = "success" ]; then
            echo "PR head ${PR_HEAD:0:7} 에서 build & test 통과 — 배포에서는 테스트를 건너뜁니다."
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR head ${PR_HEAD:0:7} 의 build & test 결과=${RESULT:-없음} — 전체 빌드로 검증합니다."
            echo "tested=false" >> "$GITHUB_OUTPUT"
          fi

      # 검증된 커밋이면 jar 만 만든다. 아니면 지금까지처럼 테스트까지 돌린다.
      #
      # jar 조립은 어느 쪽이든 한다 — 테스트만 돌리면 조립 단계(리소스 중복·repackaging)에서 나는
      # 문제를 놓친다는 것이 CI 가 `build` 를 쓰는 이유이고, 그 이유는 여기서도 그대로다.
      #
      # 외부 API 키를 넘기지 않는다: 테스트가 실키로 외부를 호출해 일일 허용량을 태운 적이 있다(#110).
      - name: 빌드
        id: build
        env:
          TESTED: ${{ steps.verified.outputs.tested }}
        run: |
          if [ "${TESTED:-false}" = "true" ]; then
            echo "이미 검증된 커밋 — jar 만 조립합니다."
            ./gradlew bootJar
          else
            echo "검증되지 않은 커밋 — 테스트까지 돌립니다."
            ./gradlew build
          fi

      # EC2 의 22번은 특정 IP 하나만 열려 있다(offway-tokyo-sg). Actions 러너는 매번 다른 IP 라
      # 그대로면 SSH 가 timeout 으로 죽는다. 22번을 상시 개방하는 대신 이 실행의 러너 IP 만
      # 잠깐 열고, 끝나면(실패해도) 즉시 회수한다.
      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: 러너 IP 를 SSH 허용에 추가
        id: open-ssh
        run: |
          RUNNER_IP=$(curl -s --max-time 10 https://checkip.amazonaws.com)
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 --cidr "$RUNNER_IP/32"

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 호스트 키를 미리 신뢰 목록에 넣는다 — StrictHostKeyChecking=no 로 열어두면
          # 중간자 공격을 그대로 받는다.
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: 배포 산출물 전송
        id: transfer
        run: |
          JAR=$(ls build/libs/*.jar | grep -v plain | head -1)
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'mkdir -p ~/offway/build/libs'
          scp -i ~/.ssh/deploy_key "$JAR" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/offway/build/libs/app.jar"
          scp -i ~/.ssh/deploy_key Dockerfile \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/offway/Dockerfile"
          # 복구 스크립트도 함께 올린다 — 교체·스모크 두 스텝이 같은 파일을 부른다(#297).
          # **교체보다 먼저 올라와 있어야 한다.** 교체가 실패한 뒤에 올리면 그때는 이미 늦다.
          scp -i ~/.ssh/deploy_key scripts/recover-container.sh \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/offway/recover-container.sh"

      # 환경변수는 --env-file 로 넘긴다. docker run -e 로 나열하면 서버에서 `ps` 만 쳐도
      # DB 비밀번호와 API 키가 그대로 보인다.
      - name: 환경변수 파일 생성 (600)
        run: |
          # quoted heredoc('ENVEOF') 이어야 한다 — 따옴표가 없으면 셸이 $ 를 변수로 해석해
          # bcrypt 해시($2y$10$...)의 $2y·$10 이 빈 문자열로 치환되고, 계정이 맞아도 401 이 난다.
          # secrets 참조는 Actions 가 YAML 단계에서 치환하므로 quote 를 붙여도 정상 주입된다
          # (셸에 닿을 때는 이미 실제 값이다). 이 주석에 표현식 문법을 그대로 쓰면 안 된다 —
          # run 블록은 주석까지 Actions 가 먼저 훑어서, 빈 표현식으로 보고 파싱이 깨진다.
          cat > env.prod <<'ENVEOF'
          SPRING_PROFILES_ACTIVE=prod
          DB_URL=${{ secrets.DB_URL }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          OFFWAY_BASIC_USERNAME=${{ secrets.OFFWAY_BASIC_USERNAME }}
          OFFWAY_BASIC_PASSWORD=${{ secrets.OFFWAY_BASIC_PASSWORD }}
          DATA_GO_KR_SERVICE_KEY=${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          TMAP_APP_KEY=${{ secrets.TMAP_APP_KEY }}
          DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_APP_ID=${{ secrets.KAKAO_APP_ID }}
          KAKAO_WEB_REDIRECT_URI=https://api.offway.cloud/api/v1/auth/oauth2/kakao/callback
          KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
          GOOGLE_AUDIENCES=${{ secrets.GOOGLE_AUDIENCES }}
          APPLE_AUDIENCES=${{ secrets.APPLE_AUDIENCES }}
          APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY_BASE64=${{ secrets.APPLE_PRIVATE_KEY_BASE64 }}
          PROVIDER_TOKEN_KEY_BASE64=${{ secrets.PROVIDER_TOKEN_KEY_BASE64 }}
          PROVIDER_TOKEN_KEY_VERSION=${{ secrets.PROVIDER_TOKEN_KEY_VERSION }}
          FIREBASE_SERVICE_ACCOUNT_BASE64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          S3_BUCKET=${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          S3_PUBLIC_BASE_URL=${{ secrets.S3_PUBLIC_BASE_URL }}
          ENVEOF
          scp -i ~/.ssh/deploy_key env.prod \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/offway/env.prod"
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'chmod 600 ~/offway/env.prod'
          rm -f env.prod

      - name: 이미지 빌드 & 컨테이너 교체
        id: swap
        shell: bash
        run: |
          # **pipefail 을 켠다.** 아래에서 원격 출력을 tee 로 갈라 파일에도 남기는데, 없으면 파이프라인
          # 종료코드가 tee 의 0 이 되어 교체 실패가 성공으로 둔갑한다(스모크 스텝과 같은 이유).
          set -o pipefail
          # 원격 출력을 알림 스텝이 읽는 로그로도 갈라 둔다 — 교체가 실패하고 복구가 돌았을 때
          # "서비스가 살아 있는가" 를 그 표식으로 가른다. 교체가 성공하면 다음 스모크 스텝이 같은
          # 파일을 덮어쓰므로(tee 는 overwrite) 남는 것은 언제나 마지막으로 실패한 단계의 로그다.
          #
          # 커밋 SHA 를 원격 스크립트의 $1 로 넘긴다. heredoc 이 quoted('REMOTE') 라 러너 쪽 변수는 확장되지 않는다.
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' -- "${{ github.sha }}" <<'REMOTE' 2>&1 | tee "$RUNNER_TEMP/deploy-remote.log"
          set -euo pipefail
          SHA="$1"
          cd ~/offway

          # latest 만 쓰면 이전 이미지가 덮여 롤백할 대상이 사라진다. 커밋 SHA 로도 태그해 두면
          # 배포가 잘못됐을 때 `docker run ... offway-core:<이전SHA>` 로 즉시 되돌릴 수 있다.
          docker build -t "offway-core:$SHA" -t offway-core:latest .

          # MySQL 은 앱과 같은 도커 네트워크에 있고 3306 을 호스트로 노출하지 않는다 — 컨테이너끼리만
          # 통신하므로 외부에서 DB 에 직접 붙을 수 없다. DB_URL 의 호스트가 컨테이너명(offway-mysql)인 이유다.
          docker network inspect offway-net >/dev/null 2>&1 || docker network create offway-net
          if ! docker ps --format '{{.Names}}' | grep -qx offway-mysql; then
            echo "MySQL 컨테이너가 떠 있지 않습니다 — 배포를 중단합니다."
            exit 1
          fi

          # 되돌아갈 지점을 먼저 적어 둔다. 자동 배포에서는 사람이 지켜보지 않으므로, 새 컨테이너가
          # 안 뜨면 워크플로우가 스스로 이 이미지로 돌아가야 한다(아래 "기동 확인" 단계).
          # 컨테이너가 없으면(첫 배포) 빈 파일이 되고, 그때는 롤백 대상이 없다는 뜻이다.
          docker inspect -f '{{.Config.Image}}' offway-core > ~/offway/.prev-image 2>/dev/null || : > ~/offway/.prev-image
          echo "이전 이미지: $(cat ~/offway/.prev-image || echo '(없음)')"

          # 새 컨테이너를 띄우기 전에 기존 것을 내린다. 같은 8080 을 쓰므로 공존할 수 없다.
          #
          # **여기부터가 서비스가 사라져 있는 구간이다.** 이 사이에서 실패하면 스텝이 죽고, 롤백이 들어
          # 있는 다음 스텝은 `if: success()` 때문에 건너뛰어진다 — 복구가 아예 안 돌아 서버가 내려간 채
          # 남는다(#297). 그래서 이 구간의 실패는 **여기서 직접** 복구한다.
          docker rm -f offway-core 2>/dev/null || true

          # 8080 을 **호스트 로컬에만** 묶는다(#232). 인터넷에서 오는 요청은 Caddy 가 443 에서 TLS 를
          # 끊고 offway-net 안에서 offway-core:8080 으로 넘긴다 — 그 경로는 호스트 포트를 안 거치므로
          # 이 바인딩과 무관하다. 아래 스모크는 서버 안에서 localhost 로 부르므로 그대로 산다.
          if ! docker run -d \
            --name offway-core \
            --network offway-net \
            --restart unless-stopped \
            --env-file ~/offway/env.prod \
            -p 127.0.0.1:8080:8080 \
            "offway-core:$SHA"; then
            echo "새 컨테이너를 띄우지 못했습니다 — 복구를 시도합니다"
            # 복구 스크립트가 언제나 1 로 끝난다(배포는 실패다). 그 코드로 이 스텝도 실패한다.
            bash ~/offway/recover-container.sh
          fi

          # 배포마다 쌓이는 dangling 이미지를 정리한다 — 인스턴스 디스크가 조용히 찬다.
          docker image prune -f

          # SHA 태그는 롤백 대상이라 prune 이 지우지 않는다(태그가 붙어 있다). 대신 직접 최근 N개만 남긴다 —
          # 무한히 쌓이면 디스크가 찬다.
          #
          # **되돌아갈 이미지는 반드시 제외한다.** 하루에 여러 번 배포하면 롤백 대상이 보존 개수 밖으로
          # 밀려나는데, 그걸 지우고 나면 롤백이 "이미지 없음" 으로 실패해 서버가 죽은 채 남는다.
          # 실제로 그렇게 한 번 내려갔다.
          PREV_TAG=$(cut -d: -f2 ~/offway/.prev-image 2>/dev/null || echo "")
          docker images --filter=reference='offway-core:*' --format '{{.Tag}} {{.CreatedAt}}' \
            | grep -v '^latest ' \
            | { [ -n "$PREV_TAG" ] && grep -v "^$PREV_TAG " || cat; } \
            | sort -k2 -r | tail -n +5 | awk '{print $1}' \
            | xargs -r -I{} docker rmi "offway-core:{}" 2>/dev/null || true
          REMOTE

      # 컨테이너가 떴다고 앱이 뜬 건 아니다. DB 접속 실패·마이그레이션 실패는 기동 중에 죽는다.
      # 그리고 떴다고 기능이 되는 것도 아니다 — 스모크로 실제 응답까지 본 뒤에야 배포를 성공으로 친다.
      # 어느 쪽이든 실패하면 이전 이미지로 되돌린다. 자동 배포에서는 사람이 손으로 되돌릴 수 없다.
      - name: 기동 확인 · 스모크 · 실패 시 롤백
        id: smoke
        shell: bash
        run: |
          # **pipefail 을 반드시 켠다.** 아래에서 원격 출력을 tee 로 갈라 파일에도 남기는데, pipefail 이
          # 없으면 파이프라인 종료코드가 tee 의 0 이 되어 **배포 실패가 성공으로 둔갑한다.** Actions 의
          # 기본 셸은 `bash -e` 라 pipefail 이 꺼져 있어, 여기서 켜지 않으면 롤백이 돌아도 초록불이 뜬다.
          set -o pipefail
          # 스모크 비밀번호만 러너에서 넘긴다. 서버의 env.prod 에는 bcrypt 해시만 있어 평문을 복원할 수
          # 없다({bcrypt} 접두어를 떼면 해시가 남을 뿐이다).
          #
          # 사용자명은 반대로 **서버 파일에서 읽는다.** 시크릿을 인자로 넘기면 값 끝의 개행 하나만으로도
          # `-u "user\n:pass"` 가 되어 401 이 난다 — 실제로 그렇게 두 번 거짓 롤백이 났다.
          # env.prod 에서 읽으면 그 줄만 잘라오므로 개행이 섞이지 않고, 서버가 실제로 쓰는 값과도 어긋나지 않는다.
          # 원격 출력을 파일로도 갈라 둔다 — 알림 스텝이 "왜 실패했나"(롤백됐는지, 서비스가 살아 있는지)를
          # 이 로그의 표식으로 가른다. 화면 출력은 tee 라 그대로 남는다.
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'bash -s' -- "${{ secrets.OFFWAY_SMOKE_PASSWORD }}" <<'REMOTE' 2>&1 | tee "$RUNNER_TEMP/deploy-remote.log"
          set -uo pipefail
          # 비밀번호도 같은 이유로 개행을 걷어낸다.
          SMOKE_PASS=$(printf '%s' "$1" | tr -d '\r\n')
          cd ~/offway
          # tr 로 개행·캐리지리턴을 걷어낸다. 시크릿을 파일에 쓸 때 끝에 붙었을 수 있다.
          SMOKE_USER=$(grep '^OFFWAY_BASIC_USERNAME=' env.prod | cut -d= -f2- | tr -d '\r\n')
          # 값이 아니라 길이만 남긴다 — 빈 값인지, 개행이 붙었는지는 이것만으로 가려진다.
          echo "[1/3] 스모크 계정 준비: 사용자명 길이=${#SMOKE_USER} 비밀번호 길이=${#SMOKE_PASS}"

          # 복구는 교체 스텝과 **같은 파일**을 부른다(#297). 예전에는 이 자리에 함수로 있었는데,
          # 그러면 교체가 실패해 이 스텝이 건너뛰어질 때 복구도 함께 사라졌다.
          # 스크립트는 언제나 1 로 끝난다 — 되돌아갔든 유지했든 이번 배포는 실패다.
          rollback() {
            bash ~/offway/recover-container.sh
          }

          # ① 기동 — 401 도 정상이다(인증 게이트가 살아 있다는 뜻, #122)
          echo "[2/3] 기동 확인 시작"
          up=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:8080/api/v1/categories || true)
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then
              echo "기동 확인 (HTTP $code, ${i}회 시도)"
              up=yes
              break
            fi
            sleep 5
          done
          [ -n "$up" ] || { echo "기동 확인 실패 — 30회 시도 동안 응답 없음"; rollback; }
          echo "[3/3] 스모크 시작"

          # ② 스모크 — 실제 응답까지 본다.
          #
          # localhost 로 부른다. 같은 인스턴스 안의 loopback 이라 트래픽이 네트워크 인터페이스를
          # 타지 않으므로 평문 HTTP 여도 도청 경로가 없다 — 이걸 엿보려면 이미 이 서버에 들어와
          # 있어야 하고, 그 상황이면 env.prod(600)를 읽는 편이 빠르다.
          # 반대로 러너에서 공인 IP 로 부르면 그때는 진짜 평문이 인터넷을 지난다. 여기서
          # 서버 안쪽을 택한 이유다. 8080 에 TLS 를 붙이면 그때 https 로 바꾼다.
          #
          # 외부 API 에 기대는 엔드포인트(코스 생성 등)는 일부러 넣지 않는다. 관광 API 한도가 소진되면
          # 우리 배포는 멀쩡한데 롤백이 발동한다. 여기서는 우리 코드와 DB 만으로 답하는 것만 본다.
          smoke() {
            name="$1"; expect="$2"; shift 2
            got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$@" || true)
            if [ "$got" != "$expect" ]; then
              echo "스모크 실패: $name — 기대 $expect, 실제 $got"
              return 1
            fi
            echo "스모크 통과: $name ($got)"
          }

          smoke "인증 게이트(무인증 401)" 401 http://localhost:8080/api/v1/categories || rollback
          if ! smoke "카테고리 조회" 200 -u "$SMOKE_USER:$SMOKE_PASS" http://localhost:8080/api/v1/categories; then
            # 값은 남기지 않는다. 길이만으로 "빈 값인지·개행이 붙었는지" 는 충분히 가려진다.
            echo "  (진단) 사용자명 길이=${#SMOKE_USER} 비밀번호 길이=${#SMOKE_PASS}"
            rollback
          fi
          smoke "지역 장소 목록"          200 -u "$SMOKE_USER:$SMOKE_PASS" 'http://localhost:8080/api/v1/regions/76/places?kind=STAY' || rollback

          # 상태 코드만 보면 "200 인데 내용이 빈" 배포를 성공으로 넘긴다. 실제로 그렇게 나갔다 —
          # 적재가 89곳 중 42곳에서 멈췄는데 목록 API 는 멀쩡히 200 을 줬다.
          # 장소 풀은 부팅 시 전량 적재되므로, 어느 지역이든 비어 있으면 적재가 깨진 것이다.
          # 적재는 기동 뒤에도 이어진다(16만 건 배치). 기동 확인 직후에 물으면 아직 0 건이라,
          # 실제로 그렇게 거짓 실패가 났다. 채워질 때까지 기다린 뒤 판정한다.
          for probe in "76 STAY" "1 SIGHT" "89 FOOD"; do
            set -- $probe
            # curl 성공 여부를 먼저 가른다. timeout·연결 오류로 끊긴 부분 응답에도 "totalElements" 가
            # 섞여 있을 수 있어, 바로 파싱하면 실패를 통과로 읽는다.
            body=$(curl -s --max-time 20 -w '\n%{http_code}' -u "$SMOKE_USER:$SMOKE_PASS" \
              "http://localhost:8080/api/v1/regions/$1/places?kind=$2")
            if [ $? -ne 0 ]; then
              echo "스모크 실패: 장소 풀 조회 실패(curl) — region=$1 kind=$2"
              rollback
            fi
            status=$(printf '%s' "$body" | tail -n1)
            if [ "$status" != "200" ]; then
              echo "스모크 실패: 장소 풀 조회 HTTP $status — region=$1 kind=$2"
              rollback
            fi
            total=$(printf '%s' "$body" | sed -n 's/.*"totalElements":\([0-9]*\).*/\1/p')
            # 아직 적재 중이면 잠시 뒤 다시 본다(최대 90초).
            waited=0
            while { [ -z "$total" ] || [ "$total" -lt 1 ] 2>/dev/null; } && [ "$waited" -lt 90 ]; do
              sleep 5
              waited=$((waited + 5))
              body=$(curl -s --max-time 20 -w '\n%{http_code}' -u "$SMOKE_USER:$SMOKE_PASS" \
                "http://localhost:8080/api/v1/regions/$1/places?kind=$2")
              total=$(printf '%s' "$body" | sed -n 's/.*"totalElements":\([0-9]*\).*/\1/p')
            done
            if [ -z "$total" ] || [ "$total" -lt 1 ] 2>/dev/null; then
              echo "스모크 실패: 장소 풀이 비었습니다 — region=$1 kind=$2 total=${total:-파싱실패} (${waited}초 대기)"
              rollback
            fi
            echo "스모크 통과: 장소 풀 region=$1 kind=$2 ($total건, ${waited}초 대기)"
          done

          echo "배포 성공 — 기동·스모크 모두 통과"
          REMOTE

      # 지금 서비스가 실제로 떠 있는지 한 번 찔러 둔다(#295).
      #
      # **왜 필요한가.** 교체 단계는 기존 컨테이너를 지우고 새로 띄우는데, 그 사이가 실패하면 스모크
      # 단계 자체가 건너뛰어져 그 안의 롤백이 돌지 않는다 — 컨테이너가 사라진 채 남는다. 그때 알림이
      # "교체 실패" 만 말하면 서비스가 죽은 것인지 아닌지를 알 수 없다.
      #
      # 실패해도 배포 판정을 바꾸지 않는다. 상태를 못 읽으면 못 읽었다고 알리면 될 뿐이다.
      #
      # SSH 키와 22번 개방이 아직 살아 있는 이 자리에서만 가능하다 — 아래 두 스텝이 곧 회수한다.
      - name: 서비스 상태 확인
        id: probe
        if: always() && steps.open-ssh.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          code=$(ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8080/api/v1/categories" \
            2>/dev/null || echo "unreachable")
          # 401 도 살아 있는 것이다 — 인증 게이트가 응답한 것이라 앱이 떠 있다는 뜻이다.
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          echo "서비스 상태 확인: $code"

      # TLS 인증서 남은 기간(#232) — **조용히 만료되는 것**이 이 구성의 유일한 위험이다.
      #
      # Caddy 는 만료 30일 전부터 갱신을 시도하고 **실패해도 옛 인증서로 계속 서비스한다.** 그래서
      # 갱신이 3주 내내 실패해도 화면은 멀쩡하고, 만료일에 전 사용자가 한꺼번에 끊긴다.
      #
      # 러너에서 공개 도메인을 직접 본다 — SSH 도 서버 안 상태도 필요 없고, 사용자가 실제로 받는 그
      # 인증서를 본다. 7일 이하면 배포를 실패시킨다: 그쯤이면 갱신이 3주 넘게 실패한 것이라 경고 한 줄로는
      # 부족하고, 초록 배포 로그에 묻히면 그게 바로 조용한 실패다.
      #
      # 배포를 막지는 못한다 — 이 스텝은 교체·스모크가 끝난 뒤에 온다. 실패는 "이번 배포가 잘못됐다" 가
      # 아니라 **"인증서를 지금 손봐야 한다"** 는 신호다.
      - name: TLS 인증서 만료 확인
        if: always()
        shell: bash
        run: |
          DOMAIN=api.offway.cloud
          end=$(echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null \
            | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
          if [ -z "$end" ]; then
            echo "::error::$DOMAIN 443 에서 인증서를 읽지 못했습니다 — Caddy 가 떠 있는지 확인하세요"
            exit 1
          fi
          left=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "인증서 만료 $end (남은 ${left}일)"
          if [ "$left" -le 7 ]; then
            echo "::error::TLS 인증서가 ${left}일 남았습니다 — 갱신이 3주 넘게 실패한 상태입니다"
            echo "docker logs offway-caddy 로 갱신 실패 사유를 확인하세요"
            exit 1
          fi
          if [ "$left" -le 21 ]; then
            echo "::warning::TLS 인증서가 ${left}일 남았습니다 — 갱신이 안 되고 있을 수 있습니다"
          fi

      # 배포가 실패해도 규칙은 반드시 회수한다 — 남으면 22번이 조금씩 영구 개방된다.
      - name: 러너 IP 회수
        if: always() && steps.open-ssh.outputs.runner_ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 --cidr "${{ steps.open-ssh.outputs.runner_ip }}/32"

      - name: SSH 키 삭제
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # 배포 결과를 디스코드로 알린다(#295).
      #
      # **앱이 아니라 여기서 보낸다.** 앱의 Notifier 에 맡기면 배포가 깨져 앱이 안 뜰 때 알림도 함께
      # 죽는다 — 정작 알아야 할 때 못 받는다. 알림 수단이 알림 대상과 함께 사라지면 안 된다.
      #
      # **쿼터 경보(#257)와 다른 웹훅을 쓴다.** 배포는 성공해도 매번 울려, 같은 채널에 두면 "봐야 하는"
      # 신호를 묻는다.
      - name: 배포 결과 알림
        if: always()
        shell: bash
        env:
          # 표현식을 셸 인용부호 안에 직접 박지 않는다 — 값에 따옴표·백틱이 섞이면 명령이 깨지거나
          # 실행된다. env 로 넘기면 셸이 값을 해석하지 않는다.
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TRANSFER_OUTCOME: ${{ steps.transfer.outcome }}
          SWAP_OUTCOME: ${{ steps.swap.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SERVICE_CODE: ${{ steps.probe.outputs.http_code }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -uo pipefail

          # 웹훅이 없으면 조용히 건너뛴다. 알림 설정 때문에 배포가 실패하면 본말이 전도된다.
          if [ -z "${WEBHOOK:-}" ]; then
            echo "DISCORD_DEPLOY_WEBHOOK_URL 이 없어 배포 알림을 건너뜁니다."
            exit 0
          fi

          REMOTE_LOG="$RUNNER_TEMP/deploy-remote.log"
          # 제목 첫 줄만, 그리고 **길이도 자른다**. 디스코드는 content 가 2,000자를 넘으면 400 으로
          # 통째로 거절해 알림이 유실된다. 커밋 제목에는 길이 제한이 없어(commit-msg 훅도 안 막는다)
          # 그대로 실으면 그 한도를 넘길 수 있다. 나머지 칸은 고정 문구라 200자면 충분하다.
          #
          # **파이프로 자르지 않는다.** `printf ... | head -1` 은 head 가 첫 줄만 읽고 파이프를 닫아
          # printf 가 SIGPIPE 로 죽는다. pipefail 이 그걸 파이프라인 실패로 전파하고, GitHub Actions 의
          # `shell: bash` 는 기본으로 `-e` 를 켜므로 거기서 스텝이 끝난다 — 배포는 성공했는데 알림만
          # 통째로 못 가고, 그 사실조차 "배포 실패" 로 보인다(2026-09-05 실측, 두 회차 연속).
          #
          # 짧은 메시지에서는 head 가 파이프를 닫기 전에 printf 가 다 써서 통과한다. **스쿼시 머지처럼
          # 본문이 긴 커밋에서만 터지므로** 평소에는 안 보인다. 셸 파라미터 확장은 파이프가 없어 이
          # 함정 자체가 없다.
          SUBJECT=${COMMIT_MESSAGE%%$'\n'*}
          SUBJECT=${SUBJECT:0:200}

          # 복구 스크립트가 남긴 표식으로 **서비스가 지금 살아 있는지**를 가른다. 이게 이 알림의 핵심이다 —
          # 복구가 돌았으면 아침에 봐도 되고, 안 돌았으면 지금 붙어야 한다.
          #
          # 교체·스모크 두 단계가 같은 스크립트를 부르므로(#297) 판정도 한 곳에 둔다. 표식이 없으면 1 로
          # 끝나 호출부가 다른 근거(실제 응답 코드)로 넘어간다.
          #
          # 문구는 `scripts/recover-container.sh` 가 찍는 것과 짝이다 — 한쪽만 고치면 조용히 안 맞는다.
          recovery_detail() {
            if grep -q '롤백 완료' "$REMOTE_LOG" 2>/dev/null; then
              echo "**이전 버전으로 롤백됨** (서비스 정상)"
            elif grep -q '대체 기동 확인' "$REMOTE_LOG" 2>/dev/null; then
              echo "롤백 이미지가 없어 **방금 배포한 버전으로 유지** (서비스는 떠 있음)"
            elif grep -qE '롤백까지 실패|대체 기동까지 실패|되돌릴 이전 이미지가 없습니다' "$REMOTE_LOG" 2>/dev/null; then
              echo "**서비스 중단 — 수동 개입 필요**"
            else
              return 1
            fi
          }

          # 실패했으면 **어느 단계에서 왜** 죽었는지 가른다. "실패" 만 오면 결국 Actions 를 열어야 해서
          # 알림의 값어치가 절반이다.
          case "$JOB_STATUS" in
            success) TITLE="배포 성공"; DETAIL="기동·스모크 모두 통과" ;;
            cancelled) TITLE="배포 취소됨"; DETAIL="누군가 중단했거나 새 배포가 밀어냈습니다" ;;
            *)
              TITLE="배포 실패"
              if [ "$BUILD_OUTCOME" = "failure" ]; then
                DETAIL="빌드·테스트 실패 — 서버는 이전 버전 그대로입니다"
              elif [ "$TRANSFER_OUTCOME" = "failure" ]; then
                DETAIL="산출물 전송 실패 — 서버는 이전 버전 그대로입니다"
              elif [ "$SWAP_OUTCOME" = "failure" ]; then
                # 교체 단계는 기존 컨테이너를 지운 뒤 새로 띄운다. 그 사이가 실패하면 이제 **그 자리에서
                # 복구가 돈다**(#297) — 그 결과가 로그 표식으로 남으므로 스모크 실패와 같은 방식으로 읽는다.
                #
                # 표식이 없는 경우도 정상이다. 빌드나 MySQL 확인처럼 **기존 컨테이너를 지우기 전에** 실패하면
                # 복구할 것이 없고 서비스도 멀쩡하다. 그때는 실제 응답으로 판정한다.
                if RECOVERY=$(recovery_detail); then
                  DETAIL="컨테이너 교체 실패 → $RECOVERY"
                else
                  case "$SERVICE_CODE" in
                    200|401) DETAIL="이미지 빌드·컨테이너 교체 실패 (서비스는 응답 중)" ;;
                    "") DETAIL="이미지 빌드·컨테이너 교체 실패 — **서비스 상태 미확인**" ;;
                    *) DETAIL="이미지 빌드·컨테이너 교체 실패 — **서비스 중단(응답 $SERVICE_CODE) · 수동 개입 필요**" ;;
                  esac
                fi
              elif [ "$SMOKE_OUTCOME" = "failure" ]; then
                if RECOVERY=$(recovery_detail); then
                  DETAIL="기동·스모크 실패 → $RECOVERY"
                else
                  DETAIL="기동·스모크 실패 (롤백 결과를 확인하지 못했습니다)"
                fi
              else
                DETAIL="배포 전 단계에서 실패"
              fi
              ;;
          esac

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # 포맷 문자열은 **반드시 작은따옴표**다. 백틱은 디스코드의 인라인 코드 표기라 리터럴이어야
          # 하는데, 큰따옴표로 바꾸면 셸이 그것을 명령 치환으로 읽어 %s 를 실행하려 든다.
          # shellcheck disable=SC2016
          TEXT=$(printf '**%s**\n%s\n`%s` %s\n실행: %s\n%s' \
            "$TITLE" "$DETAIL" "${GITHUB_SHA:0:7}" "$SUBJECT" "$GITHUB_ACTOR" "$RUN_URL")

          # 본문은 jq 로 만든다 — 커밋 메시지에 따옴표·개행이 섞여도 JSON 이 깨지지 않는다.
          jq -n --arg content "$TEXT" '{content: $content}' > "$RUNNER_TEMP/discord.json"

          # **알림 실패가 배포 결과를 바꾸지 않는다.** URL 은 그 자체가 자격증명이라 출력에 남기지 않는다
          # (-s 로 진행률도 끈다). 상태코드만 찍는다.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            -H 'Content-Type: application/json' \
            -d "@$RUNNER_TEMP/discord.json" "$WEBHOOK" || echo "000")

          # **못 보냈으면 못 보냈다고 남긴다.** 상태코드만 찍고 넘어가면 알림 유실이 아무 흔적을 남기지
          # 않는다 — 조용히 안 오는 알림은 없는 알림과 같고, 그 사실조차 아무도 모른다. 배포 자체는
          # 성공했을 수 있으므로 실패로 만들지는 않고, 요약에 눈에 띄게 남긴다.
          if [ "$code" = "204" ] || [ "$code" = "200" ]; then
            echo "디스코드 알림 전송 완료 (HTTP $code)"
          else
            echo "::warning title=배포 알림 실패::디스코드가 HTTP $code 로 답해 알림이 전달되지 않았습니다 (웹훅 URL·권한을 확인하세요)"
          fi
          exit 0
