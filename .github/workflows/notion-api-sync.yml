name: Notion API 명세 동기화

# dev 에 API 관련 변경이 머지되면 springdoc OpenAPI 를 뽑아 Notion 페이지에 자동 반영한다.
# 코드(*Api 어노테이션)가 진실 → Notion 은 그 미러. 수동 실행(workflow_dispatch)도 가능.
on:
  push:
    branches: [dev]
    paths:
      - 'src/main/**'
      - 'scripts/notion-sync/**'
      - '.github/workflows/notion-api-sync.yml'
  workflow_dispatch:

concurrency:
  group: notion-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: OpenAPI → Notion
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7
        with:
          # 이 잡은 git push 가 필요 없고 뒤에서 서드파티 코드(gradle bootRun)를 돌린다.
          # GITHUB_TOKEN 을 디스크에 남기지 않아 그 코드가 자격증명을 못 읽게 한다(zizmor).
          persist-credentials: false

      - name: JDK 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v6.2.0

      # 앱을 local(H2, 키 없음)로 잠깐 띄워 /v3/api-docs 를 받는다. springdoc 은 런타임 생성이라 부팅이 필요하다.
      - name: OpenAPI 덤프
        run: |
          SPRING_PROFILES_ACTIVE=local ./gradlew bootRun --no-daemon > boot.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/v3/api-docs -o openapi.json; then
              echo "OpenAPI 수신 ($(wc -c < openapi.json) bytes)"; break
            fi
            sleep 3
          done
          pkill -f 'bootRun' || true
          test -s openapi.json || { echo "OpenAPI 덤프 실패"; tail -40 boot.log; exit 1; }

      # 시크릿(GitHub Secrets): NOTION_TOKEN, NOTION_PAGE_ID. 스크립트는 표준 라이브러리만 쓴다(pip 불필요).
      - name: Notion 동기화
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: python3 scripts/notion-sync/sync_openapi_to_notion.py --openapi openapi.json
