name: Dependabot auto-merge

# dependabot PR 을 CI 통과 후 **merge commit** 으로 머지한다.
#
# 이 레포의 일반 PR 은 squash 로 머지한다(그래야 PR 제목이 dev 의 커밋 제목이 되고 커밋 컨벤션과
# 맞는다). dependabot 은 예외로 둔다 — 봇이 만든 커밋을 그대로 남겨 어떤 버전에서 어떤 버전으로
# 갔는지가 히스토리에 보이게 하기 위해서다.
#
# 자동 머지라고 검사를 건너뛰지 않는다. `--auto` 는 브랜치 보호 규칙(필수 status check)을 그대로
# 존중해서, CI 가 통과해야 실제 머지가 일어난다. 실패하면 PR 이 열린 채 남는다.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# pull_request_target 은 base 브랜치 권한으로 돈다. 필요한 것만 연다.
permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    # 봇이 만든 PR 에만 적용한다. actor 를 확인하지 않으면 누구든 브랜치 이름만 흉내내
    # 자동 머지를 얻어낼 수 있다.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 자동 머지 예약 (merge commit)
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
