name: Uptime

# 운영 API 가 밖에서 보이는지 주기적으로 확인한다(#596).
#
# **왜 앱 밖에 두나.** 우리 디스코드 알림은 전부 앱 안에서 나간다(한도·외부장애·코스사용량·정책).
# 그래서 앱이 죽으면 알림도 같이 죽는다 — 서버가 조용히 내려간 채로 남고, 사용자가 우리보다 먼저 안다.
# 감시는 감시 대상 밖에 있어야 한다.
#
# **왜 한 번이 아니라 세 번 찌르나.** 배포 중에는 컨테이너를 교체하는 몇 초 동안 응답이 없다. 한 번
# 실패로 알리면 배포마다 가짜 장애 알림이 온다. 세 번 다 실패해야 죽은 것으로 본다.
#
# **왜 상태가 바뀔 때만 알리나.** 5분마다 알리면 장애 한 번에 알림이 수십 개다. 직전 실행과 결과가
# 같으면 조용히 넘어가고, 죽은 순간과 살아난 순간만 알린다.
#
# 주기는 지정값보다 늦게 돌 수 있다(GitHub 공용 러너의 스케줄 지연). 분 단위 정확도를 기대하는
# 용도가 아니라, "몇 분 안에는 안다" 가 목적이다.
#
# **schedule 은 기본 브랜치에서만 돈다.** 지금 기본 브랜치는 `dev` 라 여기 머지되면 동작한다.
# 기본 브랜치를 옮기면 이 감시가 **조용히 멈춘다** — 알림이 안 오는 것과 서버가 멀쩡한 것이 구분이
# 안 되므로, 옮길 때 이 파일도 함께 옮겼는지 확인한다.
#
# **60일 동안 레포에 아무 활동이 없으면 GitHub 이 schedule 을 자동 비활성화한다.** 그때도 조용히
# 멈춘다. 오래 쉬었다가 심사·데모를 앞두면 Actions 탭에서 이 워크플로가 켜져 있는지 먼저 본다.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    name: api.offway.cloud
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 세 번 찌른다
        id: probe
        run: |
          set -uo pipefail
          # 401 도 정상이다 — 인증 게이트가 살아 있다는 뜻이다(배포 워크플로의 기동 확인과 같은 판정, #122).
          up=""
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              https://api.offway.cloud/api/v1/categories || echo 000)
            echo "시도 $i — HTTP $code"
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then
              up=yes
              break
            fi
            [ "$i" = "3" ] || sleep 20
          done
          if [ -n "$up" ]; then
            echo "state=up" >> "$GITHUB_OUTPUT"
          else
            echo "state=down" >> "$GITHUB_OUTPUT"
            echo "마지막 응답 코드 $code"
          fi

      - name: 직전 실행 결과와 비교
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # 직전 실행이 어떻게 끝났는지로 "상태가 바뀌었나" 를 판단한다. 워크플로 자체는 항상 성공으로
          # 끝내고(아래), 죽었을 때만 실패로 끝낸다 — 그 결론이 곧 직전 상태다.
          prev=$(gh run list --workflow uptime.yml --branch "${{ github.ref_name }}" \
                   --limit 2 --json databaseId,conclusion \
                   --jq '[.[] | select(.databaseId != ${{ github.run_id }})][0].conclusion' 2>/dev/null || echo "")
          echo "직전 결론: ${prev:-(없음)}"
          echo "was=${prev:-unknown}" >> "$GITHUB_OUTPUT"

      - name: 상태가 바뀌었으면 알린다
        env:
          # 앱이 쓰는 채널과 같은 곳으로 보낸다 — "서버가 죽었다" 는 다른 앱 알림과 같은 자리에서 읽혀야 한다.
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATE: ${{ steps.probe.outputs.state }}
          WAS: ${{ steps.previous.outputs.was }}
        run: |
          set -uo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK_URL 이 없어 알림을 건너뜁니다."
            exit 0
          fi
          # 죽었는데 직전에도 죽어 있었으면(failure) 다시 안 알린다. 살아났는데 직전에도 살아 있었으면
          # 역시 안 알린다. 첫 실행(unknown)은 살아 있으면 조용히 넘어간다.
          message=""
          if [ "$STATE" = "down" ] && [ "$WAS" != "failure" ]; then
            message="🔴 **api.offway.cloud 응답 없음** — 10초 안에 3회 모두 실패했습니다."
          elif [ "$STATE" = "up" ] && [ "$WAS" = "failure" ]; then
            message="🟢 **api.offway.cloud 복구** — 정상 응답으로 돌아왔습니다."
          fi
          if [ -z "$message" ]; then
            echo "상태 그대로($STATE) — 알리지 않습니다."
            exit 0
          fi
          # 웹훅 주소는 절대 출력하지 않는다. jq -n 으로 본문을 만들어 따옴표·줄바꿈을 안전하게 싣는다.
          jq -n --arg content "$message" '{content: $content}' > payload.json
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            -H 'Content-Type: application/json' -d @payload.json "$WEBHOOK" || echo 000)
          echo "디스코드 응답 $code"

      - name: 죽었으면 이 실행을 실패로 끝낸다
        if: steps.probe.outputs.state == 'down'
        # 다음 실행이 "직전에 죽어 있었나" 를 이 결론으로 읽는다. 알림 중복을 막는 상태 저장소가
        # 따로 없어도 되는 이유다.
        run: |
          echo "api.offway.cloud 가 응답하지 않습니다."
          exit 1
