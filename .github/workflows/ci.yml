name: CI

# dev 로 향하는 PR 과 dev 자체를 검사한다.
# 배포가 없으므로 산출물(jar)은 업로드하지 않고 러너와 함께 버린다.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# 같은 브랜치에 새 푸시가 오면 이전 실행을 취소한다 (러너 시간 낭비 방지).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # build.gradle.kts 의 toolchain 과 맞춘다. 바꿀 땐 양쪽을 함께 고친다.
          java-version: '25'

      - name: Gradle 준비 (의존성 캐시 포함)
        uses: gradle/actions/setup-gradle@v6

      # build = 컴파일 + 전체 테스트 + jar 조립.
      # test 만 돌리면 jar 조립 단계(리소스 중복·repackaging)에서 나는 문제를 놓친다.
      # 외부 의존성이 없다 - 테스트는 H2 인메모리로 돌고 API 키 없이도 부팅된다
      # (CLAUDE.md "로컬 실행성 불변식"). 그래서 서비스 컨테이너·시크릿이 필요 없다.
      - name: 빌드 + 전체 테스트
        run: ./gradlew build --no-daemon

      - name: 테스트 리포트 업로드 (실패 시에만)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
