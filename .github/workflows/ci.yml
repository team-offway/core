name: CI

# dev 로 향하는 PR 과 dev 자체를 검사한다.
# 배포가 없으므로 산출물(jar)은 업로드하지 않고 러너와 함께 버린다.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# 같은 브랜치에 새 푸시가 오면 이전 실행을 취소한다 (러너 시간 낭비 방지).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # build.gradle.kts 의 toolchain 과 맞춘다. 바꿀 땐 양쪽을 함께 고친다.
          java-version: '25'

      - name: Gradle 준비 (의존성 캐시 포함)
        uses: gradle/actions/setup-gradle@v6

      # build = 컴파일 + 전체 테스트 + jar 조립.
      # test 만 돌리면 jar 조립 단계(리소스 중복·repackaging)에서 나는 문제를 놓친다.
      # 외부 의존성이 없다 - 테스트는 H2 인메모리로 돌고 API 키 없이도 부팅된다
      # (CLAUDE.md "로컬 실행성 불변식"). 그래서 서비스 컨테이너·시크릿이 필요 없다.
      - name: 빌드 + 전체 테스트
        run: ./gradlew build --no-daemon

      - name: 테스트 리포트 업로드 (실패 시에만)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

  # 테스트는 H2 로 돈다(부팅 비용·로컬 실행성). 그래서 **MySQL 에서만 나는 문제를 못 잡는다.**
  # 실제로 겪었다 — `ALTER TABLE ... ALTER COLUMN c SET NOT NULL` 은 H2 에서 통과하지만 MySQL 은
  # `MODIFY` 만 받는다. 눈으로 걸러서 넘어갔을 뿐, 다음에도 걸린다는 보장이 없다.
  # 자동 배포로 전환한 뒤로는 이걸 배포 중에 알면 늦는다(운영 DB 에 절반만 적용된 채 기동이 실패한다).
  #
  # 여기서는 운영과 같은 MySQL 에 마이그레이션을 실제로 적용해 본다. 앱을 prod 프로파일로 띄우면
  # Flyway 가 부팅 중에 전부 돌리므로, 문법·순서·checksum 문제가 이 단계에서 드러난다.
  migration:
    name: MySQL 마이그레이션 검증
    runs-on: ubuntu-latest

    services:
      mysql:
        # 운영과 같은 계열로 맞춘다. 여기서만 8.0 을 쓰면 검증의 의미가 준다.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-verify
          MYSQL_DATABASE: offway
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle 준비 (의존성 캐시 포함)
        uses: gradle/actions/setup-gradle@v6

      # 테스트는 앞 잡이 이미 돌렸다. 여기서는 실행 가능한 jar 만 필요하다.
      - name: jar 조립
        run: ./gradlew bootJar --no-daemon

      - name: prod 프로파일로 기동해 마이그레이션 적용
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:mysql://127.0.0.1:3306/offway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
          DB_USERNAME: root
          DB_PASSWORD: ci-verify
          # 이 둘은 비면 부팅이 실패한다(열린 채 뜨는 쪽이 더 위험해서 그렇게 만들어 두었다).
          # 검증용 더미이고 이 잡 밖으로 나가지 않는다.
          OFFWAY_BASIC_USERNAME: ci
          OFFWAY_BASIC_PASSWORD: '{noop}ci'
        run: |
          set -uo pipefail
          JAR=$(ls build/libs/*.jar | grep -v plain | head -1)
          java -jar "$JAR" --server.port=8081 > boot.log 2>&1 &
          PID=$!

          started=""
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:8081/api/v1/categories || true)
            # 401 이면 기동 성공이다 — 인증 게이트가 살아 있다는 뜻이다.
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then
              started=yes
              break
            fi
            # 프로세스가 이미 죽었으면 더 기다릴 이유가 없다(마이그레이션 실패가 대부분 여기로 온다).
            kill -0 "$PID" 2>/dev/null || break
            sleep 2
          done

          if [ -z "$started" ]; then
            echo "── 기동 실패. 로그 ──"
            tail -120 boot.log
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          echo "기동 성공 — 마이그레이션이 MySQL 에 적용됐습니다."

      # 기동만 보면 "Flyway 가 아무것도 안 했는데 떴다" 를 못 가른다. 적용 이력을 직접 확인한다.
      - name: 적용 이력 확인
        run: |
          set -uo pipefail
          FILES=$(ls src/main/resources/db/migration/V*.sql | wc -l | tr -d ' ')
          APPLIED=$(mysql -h 127.0.0.1 -P 3306 -u root -pci-verify offway -N -B \
            -e "SELECT COUNT(*) FROM flyway_schema_history WHERE success = 1 AND type = 'SQL'")
          FAILED=$(mysql -h 127.0.0.1 -P 3306 -u root -pci-verify offway -N -B \
            -e "SELECT COUNT(*) FROM flyway_schema_history WHERE success = 0")
          echo "마이그레이션 파일 ${FILES}개 · 적용 성공 ${APPLIED}개 · 실패 ${FAILED}개"

          [ "$FAILED" = "0" ] || { echo "실패한 마이그레이션이 있습니다."; exit 1; }
          # 파일 수와 적용 수가 어긋나면 일부가 조용히 건너뛰어진 것이다.
          [ "$APPLIED" = "$FILES" ] || { echo "적용되지 않은 마이그레이션이 있습니다."; exit 1; }
