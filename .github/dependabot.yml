version: 2

# 의존성 취약점·노후화를 주기적으로 알린다.
#
# 이 서비스는 공공 API 키와 임시 인증 계정을 들고 외부에 열려 있어(8080 이 0.0.0.0), 라이브러리
# 취약점이 곧 키 유출 경로가 된다. 사람이 주기적으로 훑는 대신 봇이 PR 로 올려 준다.
#
# 주 1회로 둔다 — 매일이면 PR 이 쌓여 아무도 안 보게 된다. 묶어서 올리는 이유도 같다.
updates:
  # Gradle 의존성
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels:
      - chore
    commit-message:
      # .githooks/commit-msg 의 형식을 따른다 — 봇 PR 이라고 컨벤션에서 빠지면
      # CI 의 커밋 메시지 검사에 걸린다.
      prefix: 'chore'
    groups:
      # Spring Boot BOM 이 버전을 관리하는 것들은 함께 올라가야 한다. 하나씩 쪼개면
      # 서로 안 맞는 조합의 PR 이 여럿 생긴다.
      spring:
        patterns:
          - 'org.springframework*'
          - 'io.spring*'
      test:
        patterns:
          - 'org.junit*'
          - 'org.assertj*'
          - 'org.mockito*'

  # GitHub Actions 자체도 버전이 낡는다(체크아웃·setup-java 등).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    labels:
      - infra
    commit-message:
      prefix: 'infra'
