# 빌드 캐시(#459) — CI 가 매번 처음부터 돌던 것을 막는다.
#
# 이 파일이 없어서 캐시가 꺼진 기본값으로 돌고 있었다. PR 하나의 CI 3.7분 중 `./gradlew build` 가
# 216초인데, 로컬 warm 상태의 전체 테스트가 70초인 것과 비교하면 차이의 상당 부분이 컴파일 구간이다.
#
# **테스트를 골라 돌리는 것이 아니다.** 캐시는 입력이 같은 태스크의 결과를 재사용할 뿐이라, 바뀐
# 코드에 걸린 테스트는 그대로 다시 돈다. 놓치는 것이 없다는 뜻이다.
org.gradle.caching=true

# 단일 모듈이라 이득이 크지 않지만, 태스크 그래프가 갈리는 구간(컴파일·리소스 처리)에서 겹친다.
org.gradle.parallel=true

# 설정 단계(빌드 스크립트 평가) 결과도 재사용한다. 전체 build(테스트 포함)에서 문제 없이 저장되는 것을
# 확인하고 켰다 — 호환 안 되는 플러그인이 있으면 빌드가 경고가 아니라 실패로 알려주므로 조용히 틀리지 않는다.
org.gradle.configuration-cache=true
