# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

# 리뷰·요약·워크스루를 한국어로. 커밋·PR·문서를 한국어로 쓰는 프로젝트 규약과 맞춘다.
language: "ko-KR"

tone_instructions: "간결한 한국어 평서체로 지적한다. 근거와 재현 조건을 함께 제시하고, 프로젝트 CLAUDE.md 규약을 기준으로 판단한다."

reviews:
  profile: "assertive"
  high_level_summary: true
  poem: false

  pre_merge_checks:
    # 이 프로젝트는 "왜" 가 필요한 곳에만 주석을 단다 (CLAUDE.md).
    # 모든 메서드에 docstring 을 요구하면 자명한 위임·getter 에까지 주석이 붙어
    # 신호 대 잡음비가 나빠진다. 임계값 게이트는 끄고 판단은 리뷰에 맡긴다.
    docstrings:
      mode: "off"
    title:
      mode: "warning"
    description:
      mode: "warning"

  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/*.jar"
