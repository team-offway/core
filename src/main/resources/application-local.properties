# 로컬 프로파일 — 운영과 같은 MySQL 로 뜬다(#175).
#
# H2 를 쓰지 않는다. MODE=MySQL 은 방언을 흉내 낼 뿐 문법·타입·제약이 같지 않아,
# 마이그레이션이 로컬에서 초록인 채 MySQL 에서 깨진 적이 있다
# (#107 의 `ALTER COLUMN ... SET NOT NULL` — H2 만 받고 MySQL 은 1064).
#
# 기동 전에 DB 를 띄운다: docker compose up -d
spring.datasource.url=jdbc:mysql://${OFFWAY_DB_HOST:localhost}:${OFFWAY_DB_PORT:3306}/offway?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${OFFWAY_DB_USERNAME:offway}
spring.datasource.password=${OFFWAY_DB_PASSWORD:offway}

# JPA — 스키마는 Flyway가 만든다
spring.jpa.hibernate.ddl-auto=validate
# default_batch_fetch_size 는 프로파일 무관이라 application.properties 로 옮겼다.

# 임시 Basic 인증 기본 계정 — 시크릿 없이 부팅되는 로컬 실행성을 인증 도입으로 깨지 않는다(#122).
# {noop} 은 "인코딩 안 함" 표기다. 로컬 전용이라 평문으로 둔다.
#
# 값을 하드코딩하지 않고 기본값으로 둔다 — 하드코딩하면 프로파일 파일이 환경변수를 이겨,
# local 프로파일로 띄운 인스턴스를 dev/dev 로 고정시킨다(외부에 열면 누구나 아는 계정이 된다).
offway.security.basic.username=${OFFWAY_BASIC_USERNAME:dev}
offway.security.basic.password=${OFFWAY_BASIC_PASSWORD:{noop}dev}

# Flyway (마이그레이션 없어도 no-op으로 부팅)
spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.flyway.baseline-on-migrate=true

# 로컬은 몇 곳만 채운다 — 화면·동선 확인에는 충분하고 공용 키 소비는 1/9 이 된다(#254).
# 근본 해법은 로컬 전용 키·운영계정이다. 그것이 되면 이 값을 0(전 지역)으로 되돌린다.
offway.batch.regions-per-run=10
