# 로컬 프로파일 — H2 인메모리로 시크릿·외부 인프라 없이 부팅
spring.datasource.url=jdbc:h2:mem:offway;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA — 스키마는 Flyway가 만든다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# 인증 — 개발용 고정 서명키(HS256 최소 32바이트). prod 는 JWT_SECRET 환경변수로 주입한다.
# 이 값이 있어야 시크릿 없이도 로컬 부팅이 된다(로컬 실행성 불변식). 실제 비밀이 아니므로 커밋해도 된다.
offway.auth.jwt.secret=offway-local-development-only-signing-key-do-not-use-in-production

# Flyway (마이그레이션 없어도 no-op으로 부팅)
spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.flyway.baseline-on-migrate=true
