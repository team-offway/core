# 운영 프로파일 — MySQL. 값은 전부 환경변수로 주입한다(이미지에 시크릿을 굽지 않는다).
# 기본값을 두지 않아 **미설정이면 부팅이 실패한다** — 잘못된 DB 로 조용히 뜨는 것보다 낫다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 스키마는 Flyway 가 만든다. Hibernate 는 검증만 — ddl-auto=update 는 운영 스키마를 말없이 바꾼다.
spring.jpa.hibernate.ddl-auto=validate

# 마이그레이션은 MySQL 문법으로 쓴다 — 로컬·테스트도 MySQL 이다(persistence-convention).
# out-of-order: 브랜치별로 만든 마이그레이션이 순서가 섞여 머지돼도 적용되게 한다.
spring.flyway.enabled=true
spring.flyway.out-of-order=true
# baseline-on-migrate: 이미 테이블이 있는 DB 에 처음 붙을 때 실패하지 않게 한다.
spring.flyway.baseline-on-migrate=true


# 에러 응답에 스택·내부 메시지를 싣지 않는다(exception-and-response: detail 은 전부 사용자 대면).
server.error.include-stacktrace=never
server.error.include-message=never
