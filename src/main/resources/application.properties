spring.application.name=offway-core
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.jpa.open-in-view=false

# 캐시 워밍 스케줄러 풀 — 랭킹·콘텐츠 워밍(future.get 으로 오래 붙잡음)과 대기질 워밍이 서로 밀리지 않게 스레드를 나눈다.
spring.task.scheduling.pool.size=2

# ── 외부 API 키 ──────────────────────────────────────────────
# 값이 없어도 부팅된다(로컬 실행성 규칙) — 실제 호출만 비활성.
# 값은 (1) 환경변수 또는 (2) application-secret.properties(git 제외)에서 주입된다.
# data.go.kr 일반 인증키 하나로 특일정보·TourAPI·관광빅데이터·TAGO·코레일 공용.
offway.external.data-go-kr.service-key=${DATA_GO_KR_SERVICE_KEY:}
offway.external.tmap.app-key=${TMAP_APP_KEY:}

# ── 인증(ADR 0002) ───────────────────────────────────────────
# JWT 서명키는 prod 에서 환경변수 필수 — 없으면 아무 토큰이나 위조 가능해지므로 부팅 단계에서 막는다.
# local 은 application-local.properties 가 개발용 고정값을 제공한다(로컬 실행성 규칙).
offway.auth.jwt.secret=${JWT_SECRET:}
offway.auth.jwt.access-ttl=1h
offway.auth.jwt.refresh-ttl=60d

# provider 클라이언트 ID(audience). 비어 있어도 부팅되고, 해당 provider 로그인만 USER-002 로 실패한다.
# Google 은 iOS/Android 클라이언트 ID 가 달라 콤마로 여러 개를 넣는다.
offway.auth.oidc.google.audiences=${GOOGLE_OAUTH_AUDIENCES:}
offway.auth.oidc.kakao.audiences=${KAKAO_OAUTH_AUDIENCES:}
offway.auth.oidc.apple.audiences=${APPLE_OAUTH_AUDIENCES:}

# 로컬 시크릿 파일 — 없으면 그냥 건너뜀(optional). 이게 "키 없어도 부팅"의 핵심.
spring.config.import=optional:file:./application-secret.properties

# springdoc: OpenAPI 3.0 출력 — 3.1 모드는 nullable 객체 ref 를 {type:null,$ref} 로 깨뜨린다.
# 3.0 은 {nullable:true, allOf:[{$ref}]} 로 올바르게 감싸 apidog 검증이 통과한다.
springdoc.api-docs.version=openapi_3_0
