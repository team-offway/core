spring.application.name=offway-core
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.jpa.open-in-view=false

# N+1 차단 — 컬렉션 연관(Course→DaySchedule→Slot)을 지연 로딩할 때 부모 100건씩 묶어 IN 절로 가져온다.
# 프로파일과 무관한 JPA 동작이라 base 에 둔다. local 에만 있으면 prod 는 방어 없이 뜬다(persistence-convention).
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# 캐시 워밍 스케줄러 풀 — 랭킹·콘텐츠 워밍(future.get 으로 오래 붙잡음)과 다른 배치가 서로 밀리지 않게 스레드를 나눈다.
spring.task.scheduling.pool.size=2

# ── 로그 추적 id ────────────────────────────────────────────
# 레벨 뒤에 요청별 추적 id 를 붙인다. RequestLoggingFilter 가 MDC 에 넣고, 요청이 끝나면 지운다.
#
# **요청 줄에만 두지 않는 이유**: 추적의 값은 그 요청 중에 나온 다른 로그(외부 호출 실패 warn, 예외 스택)를
# 같은 id 로 묶는 데 있다. 요청 줄에만 있으면 정작 원인 줄이 어느 요청 것인지 몰라, 스레드 이름으로
# 역추적하던 문제로 되돌아간다.
#
# 요청 밖(부팅·스케줄러 워밍)에는 값이 없다. 폭을 6으로 고정해 그때도 칸이 유지되게 한다 — 폭이 들쭉날쭉하면
# 뒤따르는 로거·메시지 칸이 줄마다 어긋나 훑기 어렵다.
# `:-공백` 기본값은 logback 이 공백을 버려 빈 대괄호가 된다. 그래서 기본값이 아니라 폭 지정자로 채운다.
logging.pattern.level=%5p [%-6.6X{traceId}]

# ── 외부 API 키 ──────────────────────────────────────────────
# 값이 없어도 부팅된다(로컬 실행성 규칙) — 실제 호출만 비활성.
# 값은 (1) 환경변수 또는 (2) application-secret.properties(git 제외)에서 주입된다.
# data.go.kr 일반 인증키 하나로 특일정보·TourAPI·관광빅데이터·TAGO·코레일 공용.
offway.external.data-go-kr.service-key=${DATA_GO_KR_SERVICE_KEY:}
offway.external.tmap.app-key=${TMAP_APP_KEY:}

# ── 임시 Basic 인증 계정 (#122) ──────────────────────────────
# 외부 API 키와 달리 **비면 부팅이 실패한다**. 키가 없으면 그 호출만 죽지만, 계정이 없으면 서버가
# 통째로 열린 채 뜬다 — 조용히 뜨는 쪽이 훨씬 위험하다. local 은 application-local.properties 가 채운다.
# 비밀번호는 인코더 접두어를 포함한다: local {noop}평문 · 운영 {bcrypt}$2a$...
offway.security.basic.username=${OFFWAY_BASIC_USERNAME:}
offway.security.basic.password=${OFFWAY_BASIC_PASSWORD:}

# 로컬 시크릿 파일 — 없으면 그냥 건너뜀(optional). 이게 "키 없어도 부팅"의 핵심.
spring.config.import=optional:file:./application-secret.properties

# springdoc: OpenAPI 3.0 출력 — 3.1 모드는 nullable 객체 ref 를 {type:null,$ref} 로 깨뜨린다.
# 3.0 은 {nullable:true, allOf:[{$ref}]} 로 올바르게 감싸 apidog 검증이 통과한다.
springdoc.api-docs.version=openapi_3_0

# 배치 예산 — 한 회차에 갱신할 지역 수. 0 이면 제한 없음(전 지역).
#
# 로컬과 운영이 같은 data.go.kr 키를 쓰는데, 배치 건너뛰기는 자기 DB 안에서만 중복을 막는다.
# 그래서 두 곳이 각자 하루치를 태운다 — 운영은 전 지역, 로컬은 몇 곳만 채운다(#254).
offway.batch.regions-per-run=0
