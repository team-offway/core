spring.application.name=offway-core
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.jpa.open-in-view=false

# N+1 차단 — 컬렉션 연관(Course→DaySchedule→Slot)을 지연 로딩할 때 부모 100건씩 묶어 IN 절로 가져온다.
# 프로파일과 무관한 JPA 동작이라 base 에 둔다. local 에만 있으면 prod 는 방어 없이 뜬다(persistence-convention).
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# 캐시 워밍 스케줄러 풀 — 랭킹·콘텐츠 워밍(future.get 으로 오래 붙잡음)과 다른 배치가 서로 밀리지 않게 스레드를 나눈다.
spring.task.scheduling.pool.size=2

# ── 로그 추적 id ────────────────────────────────────────────
# 레벨 뒤에 요청별 추적 id 를 붙인다. RequestLoggingFilter 가 MDC 에 넣고, 요청이 끝나면 지운다.
#
# **요청 줄에만 두지 않는 이유**: 추적의 값은 그 요청 중에 나온 다른 로그(외부 호출 실패 warn, 예외 스택)를
# 같은 id 로 묶는 데 있다. 요청 줄에만 있으면 정작 원인 줄이 어느 요청 것인지 몰라, 스레드 이름으로
# 역추적하던 문제로 되돌아간다.
#
# 요청 밖(부팅·스케줄러 워밍)에는 값이 없다. 폭을 6으로 고정해 그때도 칸이 유지되게 한다 — 폭이 들쭉날쭉하면
# 뒤따르는 로거·메시지 칸이 줄마다 어긋나 훑기 어렵다.
# `:-공백` 기본값은 logback 이 공백을 버려 빈 대괄호가 된다. 그래서 기본값이 아니라 폭 지정자로 채운다.
logging.pattern.level=%5p [%-6.6X{traceId}]

# ── 외부 API 키 ──────────────────────────────────────────────
# 값이 없어도 부팅된다(로컬 실행성 규칙) — 실제 호출만 비활성.
# 값은 (1) 환경변수 또는 (2) application-secret.properties(git 제외)에서 주입된다.
# data.go.kr 일반 인증키 하나로 특일정보·TourAPI·관광빅데이터·TAGO·코레일 공용.
offway.external.data-go-kr.service-key=${DATA_GO_KR_SERVICE_KEY:}
offway.external.tmap.app-key=${TMAP_APP_KEY:}

# ── 임시 Basic 인증 계정 (#122) ──────────────────────────────
# 외부 API 키와 달리 **비면 부팅이 실패한다**. 키가 없으면 그 호출만 죽지만, 계정이 없으면 서버가
# 통째로 열린 채 뜬다 — 조용히 뜨는 쪽이 훨씬 위험하다. local 은 application-local.properties 가 채운다.
# 비밀번호는 인코더 접두어를 포함한다: local {noop}평문 · 운영 {bcrypt}$2a$...
#
# 소셜 로그인이 붙은 뒤에도 남긴다 — 걷어내는 조건은 로그인의 존재가 아니라 모든 호출자가 실제 토큰을
# 들고 오는 것이다(SecurityConfig 주석).
offway.security.basic.username=${OFFWAY_BASIC_USERNAME:}
offway.security.basic.password=${OFFWAY_BASIC_PASSWORD:}

# ── 인증(ADR 0002) ───────────────────────────────────────────
# JWT 서명키는 prod 에서 환경변수 필수 — 없으면 아무 토큰이나 위조 가능해지므로 부팅 단계에서 막는다.
# local 은 application-local.properties 가 개발용 고정값을 제공한다(로컬 실행성 규칙).
offway.auth.jwt.secret=${JWT_SECRET:}
offway.auth.jwt.access-ttl=1h
offway.auth.jwt.refresh-ttl=60d

# provider 별 설정. 비어 있어도 부팅되고, 해당 provider 로그인만 USER-002 로 실패한다(로컬 실행성 규칙).
#
# audience 는 ID 토큰의 aud 가 우리 앱 것인지 확인하는 데 쓴다 — 남의 앱용 토큰을 받아주면 그게 곧 계정 탈취다.
#
# 콤마로 여러 개를 넣는다. 넣어야 하는 값이 앱의 로그인 방식에 따라 다르고, 하나만 넣으면 그 provider
# 로그인이 전부 401(USER-001)이 되기 때문이다 — 일부가 아니라 전부다. 그래서 우리 것 전부를 나열한다.
#
#   Apple  네이티브(ASAuthorizationAppleIDProvider) → aud = 앱 Bundle ID
#          웹·Android → aud = Service ID
#          둘은 다른 값이다(com.nth.offway vs com.nth.offway.service). Service ID 만 넣으면 iOS 가 막힌다.
#   Google 앱이 serverClientID 를 지정했으면 → aud = '웹' 클라이언트 ID
#          지정하지 않았으면 → aud = 'iOS' 클라이언트 ID
#          같은 프로젝트라도 클라이언트가 다르면 다른 값이다.
#
# 여러 개를 넣는 것이 검증을 느슨하게 하는 것은 아니다. 나열하는 값이 전부 우리 앱·우리 프로젝트 것이라
# 남의 앱 토큰은 그대로 걸린다. 반대로 어느 것을 빼면 정상 사용자가 걸린다.
offway.auth.oidc.google.audiences=${GOOGLE_AUDIENCES:}
offway.auth.oidc.apple.audiences=${APPLE_AUDIENCES:}

# 카카오는 액세스 토큰에 정보가 없어 프로필 API 호출로 신원을 확인한다.
# REST API 키는 호출에 실리지 않고 미설정 provider 판별에만 쓴다.
offway.auth.oidc.kakao.rest-api-key=${KAKAO_REST_API_KEY:}

# 카카오 앱 번호 — Apple·Google 의 aud 와 같은 역할이다.
# 액세스 토큰 정보 조회(/v1/user/access_token_info)가 돌려주는 app_id 가 이 값이어야 한다.
# 이 검증이 없으면 **다른 카카오 앱에서 발급된 토큰으로 우리 계정에 로그인**할 수 있다.
# 비어 있으면 카카오 로그인을 받지 않는다(남의 앱 토큰을 받아주느니 provider 를 닫는다).
offway.auth.oidc.kakao.audiences=${KAKAO_APP_ID:}

# 로컬 시크릿 파일 — 없으면 그냥 건너뜀(optional). 이게 "키 없어도 부팅"의 핵심.
spring.config.import=optional:file:./application-secret.properties

# springdoc: OpenAPI 3.0 출력 — 3.1 모드는 nullable 객체 ref 를 {type:null,$ref} 로 깨뜨린다.
# 3.0 은 {nullable:true, allOf:[{$ref}]} 로 올바르게 감싸 apidog 검증이 통과한다.
springdoc.api-docs.version=openapi_3_0

# 배치 예산 — 한 회차에 갱신할 지역 수. 0 이면 제한 없음(전 지역).
#
# 로컬과 운영이 같은 data.go.kr 키를 쓰는데, 배치 건너뛰기는 자기 DB 안에서만 중복을 막는다.
# 그래서 두 곳이 각자 하루치를 태운다 — 운영은 전 지역, 로컬은 몇 곳만 채운다(#254).
offway.batch.regions-per-run=0

# 디스코드 알림 웹훅(#257). URL 자체가 비밀이라 시크릿 파일·환경변수로만 넣는다.
# 비면 알림을 보내지 않는다 — 시크릿 없이 부팅되는 것이 이 레포의 불변식이다.
offway.notification.discord.webhook-url=${DISCORD_WEBHOOK_URL:}
