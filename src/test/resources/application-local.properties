# 테스트용 local 프로파일 — 운영과 같은 MySQL 을 Testcontainers 로 띄운다(#175).
#
# 이 파일이 main 의 application-local.properties 를 가린다(테스트 클래스패스가 앞선다).
# 그래서 datasource 말고도 local 이 필요로 하는 값을 여기에 다시 적는다.
#
# **왜 H2 를 버렸나.** MODE=MySQL 은 방언을 흉내 낼 뿐 문법·타입·제약이 같지 않다. 실제로
# `ALTER COLUMN ... SET NOT NULL` 이 H2 에서만 통과해, 787건이 전부 초록인 채로 올라갔다가
# CI 의 MySQL 검증에서 1064 로 걸렸다(#107). 테스트가 운영과 다른 DB 로 초록을 주고 있었다.
#
# **왜 docker compose 가 아니라 Testcontainers 인가.** 개발자가 컨테이너를 손으로 띄우지 않아도
# 되고, CI 도 서비스 컨테이너 설정이 필요 없다. 개발 중 데이터와도 섞이지 않는다.
#
# `jdbc:tc:` 는 Testcontainers 의 JDBC 드라이버다 — 첫 연결에서 컨테이너를 띄우고 JVM 이 살아
# 있는 동안 재사용한다. 테스트 클래스마다 띄우면 부팅 비용이 클래스 수만큼 곱해진다.
spring.datasource.url=jdbc:tc:mysql:8.4:///offway?TC_TMPFS=/var/lib/mysql:rw&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# JPA — 스키마는 Flyway가 만든다
spring.jpa.hibernate.ddl-auto=validate

# 커넥션 풀을 작게 잡는다 — **H2 에서는 안 보이던 제약이다.**
#
# 통합 테스트는 stub 구성이 다르면 Spring 컨텍스트가 따로 만들어지고, 그 컨텍스트들이 실행 내내
# 캐시된 채 남는다(닫지 않는 게 정상 — @DirtiesContext 는 규약이 금지한다). 컨텍스트마다 Hikari 가
# 기본 10 커넥션을 잡으면 MySQL 기본 상한(max_connections=151)을 금방 넘겨 "Too many connections" 가 난다.
#
# 테스트는 컨텍스트당 한 스레드로 도므로 두 개면 충분하다.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0

# 임시 Basic 인증 기본 계정 — 통합 테스트가 @WithMockUser 를 쓰더라도 부팅에는 계정이 필요하다(#122).
offway.security.basic.username=${OFFWAY_BASIC_USERNAME:dev}
offway.security.basic.password=${OFFWAY_BASIC_PASSWORD:{noop}dev}

# Flyway
spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.flyway.baseline-on-migrate=true
